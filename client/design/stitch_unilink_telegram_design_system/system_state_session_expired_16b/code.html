, "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "space-xl": "1.5rem", "margin": "1rem", "space-lg": "1.25rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem" }, fontFamily: { "display": ["Nunito Sans"], "label-sm": ["Nunito Sans"], "headline-md": ["Nunito Sans"], "headline-sm": ["Nunito Sans"], "subhead-sm": ["Nunito Sans"], "body-md": ["Nunito Sans"], "label-md": ["Nunito Sans"], "body-lg": ["Nunito Sans"], "headline-lg": ["Nunito Sans"], "subhead-lg": ["Nunito Sans"] }, fontSize: { "display": ["32px", { lineHeight: "38px", fontWeight: "800" }], "label-sm": ["11px", { lineHeight: "14px", fontWeight: "700" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "800" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "800" }], "subhead-sm": ["14px", { lineHeight: "20px", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "21px", fontWeight: "400" }], "label-md": ["13px", { lineHeight: "18px", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg": ["26px", { lineHeight: "32px", fontWeight: "800" }], "subhead-lg": ["16px", { lineHeight: "22px", fontWeight: "600" }] } } } };</script></head><body class="min-h-screen bg-surface font-body-md text-on-surface antialiased flex flex-col justify-between selection:bg-secondary-fixed selection:text-on-secondary-fixed"><div aria-hidden="true" class="h-14 w-full shrink-0 select-none pointer-events-none"></div><main class="flex-1 flex flex-col items-center justify-center w-full px-margin bg-surface pb-safe"><div class="flex flex-col w-full items-center justify-center my-auto px-space-md py-space-xl select-none">
<!-- Whimsical Ambient Glow Backdrop -->
<div class="relative flex flex-col items-center justify-center w-full max-w-[320px]">
<div class="absolute -top-10 w-48 h-48 bg-surface-container-high rounded-full blur-3xl opacity-60 pointer-events-none -z-10"></div>
<!-- Centered Flat Cute Clock Illustration -->
<div class="relative flex items-center justify-center w-[140px] h-[140px] mx-auto mb-6">
<div class="absolute inset-0 bg-primary-fixed/40 rounded-full scale-110 blur-md -z-10"></div>
<img alt="Session Expired Clock Graphic" class="w-[140px] h-[140px] mx-auto object-contain transition-transform duration-500 hover:scale-105" height="140" src="https://lh3.googleusercontent.com/aida/ALJJyrAGu7cRM1uYzEvR-dPkjmofHB9p9Dw_uXzUNnAaQcJyvXH0wHnRG1GwAasX1L70bmCQpwp-loYa5ZhczRTx350jw2K62JGJYtmyvUk_loaTZdHzBU0Z7SRd5DWe7SiicpVVPQii5o2mo6qSZTGzX5gROem1R_1gEyJD0-Hb7caWivUaIYTc2EfWKIftwtjZf-cmEJqZVNOtJyxcZwa9bq8YN2hPOq60Wzbb_iOIWBwE" width="140"/>
<!-- Playful spark decorative accents -->
<span class="absolute -top-1 -right-2 text-secondary-container text-lg animate-bounce" style="animation-duration: 2.5s;">✨</span>
<span class="absolute -bottom-1 -left-2 text-primary text-sm opacity-70 animate-pulse">💤</span>
</div>
<!-- Main Headings -->
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center mb-2 tracking-tight">
      Session expired
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 max-w-[260px] mx-auto leading-relaxed">
      Let's sign you back in.
    </p>
<!-- Primary Action Button -->
<button class="group relative flex items-center justify-center gap-2 w-full max-w-[280px] h-[52px] bg-primary active:scale-[0.98] transition-all duration-200 rounded-full text-on-primary font-subhead-lg text-subhead-lg shadow-lg hover:shadow-primary/30 active:bg-primary-container" id="reconnect-btn" type="button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:rotate-180">sync</span>
<span>Reconnect</span>
</button>
<!-- Discreet telegram campus status footnote -->
<div class="mt-8 flex items-center justify-center gap-1.5 opacity-60">
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
<span class="font-label-sm text-label-sm text-outline tracking-wider uppercase">Campus Mini App</span>
<span class="w-1.5 h-1.5 rounded-full bg-outline-variant"></span>
</div>
</div>
</div>
<script>
  (function() {
    const btn = document.getElementById('reconnect-btn');
    if (btn) {
      btn.addEventListener('click', function() {
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) {
          icon.classList.add('animate-spin');
        }
        btn.disabled = true;
        btn.classList.add('opacity-80');
        setTimeout(() => {
          if (icon) {
            icon.classList.remove('animate-spin');
          }
          btn.disabled = false;
          btn.classList.remove('opacity-80');
        }, 1200);
      });
    }
  })();
</script></main></body></html>
