<!DOCTYPE html>

<html class="h-full" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400..800;1,6..12,400..800&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100%;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-high": "#ede4ff", "tertiary": "#00694d", "secondary": "#8a486f", "on-secondary-fixed-variant": "#6f3157", "tertiary-fixed": "#9df4cf", "on-tertiary-container": "#f5fff8", "on-background": "#1d1732", "tertiary-fixed-dim": "#81d7b4", "error-container": "#ffdad6", "on-error": "#ffffff", "surface-container-low": "#f8f1ff", "tertiary-container": "#298365", "inverse-on-surface": "#f5eeff", "on-primary-container": "#fffbff", "on-error-container": "#93000a", "surface-container": "#f2ebff", "on-tertiary-fixed": "#002116", "inverse-surface": "#332c48", "secondary-fixed-dim": "#ffaeda", "on-primary-fixed-variant": "#4330aa", "on-surface": "#1d1732", "surface-variant": "#e7deff", "on-tertiary": "#ffffff", "surface-tint": "#5c4bc3", "on-tertiary-fixed-variant": "#00513b", "primary": "#5949c0", "error": "#ba1a1a", "outline-variant": "#c9c4d5", "surface": "#fdf7ff", "surface-bright": "#fdf7ff", "on-primary-fixed": "#180065", "on-secondary-fixed": "#3a0329", "surface-dim": "#dfd5f9", "background": "#fdf7ff", "outline": "#787584", "primary-container": "#7263db", "secondary-container": "#ffaeda", "primary-fixed-dim": "#c7bfff", "surface-container-highest": "#e7deff", "secondary-fixed": "#ffd8ea", "on-secondary-container": "#7c3d63", "on-secondary": "#ffffff", "on-surface-variant": "#474553", "primary-fixed": "#e5deff", "inverse-primary": "#c7bfff", "surface-container-lowest": "#ffffff", "on-primary": "#ffffff" }, borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" }, spacing: { "space-xs": "0.25rem", "space-xl": "1.5rem", "margin": "1rem", "space-lg": "1.25rem", "space-md": "1rem", "gutter": "1rem", "space-sm": "0.5rem" }, fontFamily: { "display": ["Nunito Sans"], "label-sm": ["Nunito Sans"], "headline-md": ["Nunito Sans"], "headline-sm": ["Nunito Sans"], "subhead-sm": ["Nunito Sans"], "body-md": ["Nunito Sans"], "label-md": ["Nunito Sans"], "body-lg": ["Nunito Sans"], "headline-lg": ["Nunito Sans"], "subhead-lg": ["Nunito Sans"] }, fontSize: { "display": ["32px", { lineHeight: "38px", fontWeight: "800" }], "label-sm": ["11px", { lineHeight: "14px", fontWeight: "700" }], "headline-md": ["22px", { lineHeight: "28px", fontWeight: "800" }], "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "800" }], "subhead-sm": ["14px", { lineHeight: "20px", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "21px", fontWeight: "400" }], "label-md": ["13px", { lineHeight: "18px", fontWeight: "600" }], "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }], "headline-lg": ["26px", { lineHeight: "32px", fontWeight: "800" }], "subhead-lg": ["16px", { lineHeight: "22px", fontWeight: "600" }] } } } };</script></head><body class="min-h-screen bg-surface font-body-md text-on-surface antialiased flex flex-col justify-between selection:bg-secondary-fixed selection:text-on-secondary-fixed"><div aria-hidden="true" class="h-14 w-full shrink-0 select-none pointer-events-none"></div><main class="flex-1 flex flex-col items-center justify-center w-full px-margin bg-surface pb-safe"><div class="flex flex-col w-full items-center justify-center my-auto px-margin py-space-xl">
<!-- Ambient Soft Floating Glow Backdrop -->
<div class="relative w-full max-w-[320px] flex flex-col items-center">
<div aria-hidden="true" class="absolute -top-10 w-44 h-44 rounded-full bg-primary-fixed/40 blur-3xl pointer-events-none -z-10"></div>
<!-- Centered Flat Illustration -->
<div class="relative mb-6 flex items-center justify-center">
<div class="w-[140px] h-[140px] rounded-full bg-surface-container flex items-center justify-center shadow-sm">
<img alt="Offline Cloud Graphic" class="w-[140px] h-[140px] object-contain transition-transform duration-300 hover:scale-105 active:scale-95 select-none pointer-events-none" height="140" src="https://lh3.googleusercontent.com/aida/ALJJyrClm89vGyVsQJHTPC8issB8uhusyT260XvaAiXKZnK1KERxbuXpZomfMuotLw_jyWOeeSyadEib2aBZgLDp07zKG4M1mP7Knehai0YMVmptYlE862sBQ2t1UKIEi_r1u7V26fIRwtAJNhUJ41k0m79jDd34ac3TCRlniL_rL5mb5Fr8VtqBDN7tTqHeZkRi3tqHGH1SsT4U2H8fKrDmBrEDQeXORdMVhdIrABQIhB6P" width="140"/>
</div>
<!-- Playful Decorative Sparkles / Floating Dot -->
<span aria-hidden="true" class="absolute top-1 right-2 text-primary text-base animate-bounce" style="animation-duration: 2.5s;">✨</span>
<span aria-hidden="true" class="absolute -bottom-1 left-3 text-secondary text-xs opacity-75 animate-pulse">💫</span>
</div>
<!-- Heading -->
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center mb-2 tracking-tight">
      No connection
    </h1>
<!-- Muted Helper Text -->
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 max-w-[260px] leading-relaxed">
      Check your internet and try again.
    </p>
<!-- Interactive Pill Button with Telegram Micro-feedback -->
<button class="group relative w-full max-w-[280px] h-[52px] bg-primary text-on-primary font-subhead-lg text-subhead-lg rounded-full shadow-[0_8px_24px_rgba(89,73,192,0.28)] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2 overflow-hidden cursor-pointer" id="retry-btn" type="button">
<span class="transition-opacity duration-200 flex items-center justify-center gap-2" id="btn-text">
<span class="material-symbols-outlined text-[20px] transition-transform duration-300 group-hover:rotate-180">refresh</span>
        Try again
      </span>
<span class="hidden absolute inset-0 items-center justify-center" id="spinner">
<svg class="animate-spin h-5 w-5 text-on-primary" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8v8H4z" fill="currentColor"></path>
</svg>
</span>
</button>
</div>
</div>
<script>
  (function() {
    const btn = document.getElementById('retry-btn');
    const text = document.getElementById('btn-text');
    const spinner = document.getElementById('spinner');

    if (!btn || !text || !spinner) return;

    btn.addEventListener('click', function() {
      // Provide immediate Telegram web app style tactile feedback
      text.classList.add('opacity-0');
      spinner.classList.remove('hidden');
      spinner.classList.add('flex');
      btn.setAttribute('disabled', 'true');
      btn.classList.add('opacity-90');

      setTimeout(function() {
        text.classList.remove('opacity-0');
        spinner.classList.add('hidden');
        spinner.classList.remove('flex');
        btn.removeAttribute('disabled');
        btn.classList.remove('opacity-90');
      }, 1200);
    });
  })();
</script></main></body></html>
