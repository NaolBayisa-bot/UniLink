<!-- Discover Section Header -->
<div class="flex items-start justify-between w-full pt-1 pb-4">
<div class="flex flex-col">
<div class="flex items-center gap-1.5">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Discover</h1>
<span class="text-[22px] leading-none select-none">👀</span>
</div>
<p class="font-subhead-sm text-subhead-sm text-on-surface-variant mt-0.5">
        People who might be your type
      </p>
</div>
<!-- Campus Active Badge -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed shadow-sm">
<span class="w-2 h-2 rounded-full bg-tertiary animate-pulse"></span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Campus Active</span>
</div>
</div>
<!-- Center Empty State Canvas -->
<div class="relative flex flex-col items-center justify-center w-full min-h-[500px] px-2 py-6 my-auto text-center overflow-hidden">
<!-- Ambient Floating Pastel Backdrops & Glows -->
<div class="absolute -top-6 -left-6 w-36 h-36 bg-surface-container-high rounded-full blur-2xl opacity-60 pointer-events-none"></div>
<div class="absolute -bottom-8 -right-8 w-44 h-44 bg-secondary-container/40 rounded-full blur-2xl opacity-60 pointer-events-none"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none"></div>
<!-- Floating Sparkle Accents -->
<span class="absolute top-10 right-12 text-secondary text-sm animate-bounce opacity-70 select-none" style="animation-duration: 3s;">✦</span>
<span class="absolute bottom-16 left-10 text-primary-container text-xs animate-bounce opacity-60 select-none" style="animation-duration: 2.4s; animation-delay: 0.5s;">✧</span>
<span class="absolute top-28 left-6 text-tertiary-fixed-dim text-base animate-pulse opacity-80 select-none">✨</span>
<span class="absolute bottom-28 right-8 text-secondary-fixed-dim text-lg animate-pulse opacity-75 select-none" style="animation-delay: 1s;">🌸</span>
<!-- Sleepy Cloud Mascot Card Frame -->
<div class="relative z-10 flex flex-col items-center max-w-[320px] mx-auto">
<div class="relative mb-5 flex items-center justify-center">
<!-- Soft Circular Halo Behind Cloud -->
<div class="absolute w-36 h-36 rounded-full bg-surface-container-lowest shadow-[0_8px_32px_rgba(139,124,246,0.18)]"></div>
<img alt="Sleepy lavender cloud" class="relative z-10 w-44 h-auto mx-auto drop-shadow-sm transition-transform duration-300 hover:scale-105" src="https://lh3.googleusercontent.com/aida/ALJJyrDvFIOorlblyFf0urnJSbm_Lzzd9fU4RIi1ZkWaR5PVk4o9vxxyM-LAM1u3nC00mpLKdcXNJCD5sdSbvCvq512JPiHMhiScDz39wh1kwlVKorUyD_Y9ZbDekBQTSHlHWUjoDXVbE68F9n6htMuNoy_C2VOupoWY22JJqxjen7Ia-1rTb7t-uuEhhDy3NoAIZ2tgS4ZC3okjK32B5GpLnr_6UowlRQA1fQBW8r5-CyXalw"/>
</div>
<!-- Copy Block -->
<h2 class="font-headline-md text-headline-md text-on-surface tracking-tight">
        You've seen everyone for now ☁️
      </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[270px] mt-2 leading-relaxed">
        New people join all the time. Check back soon!
      </p>
<!-- Interactive Refresh Pill Button -->
<div class="mt-7 w-full flex flex-col items-center">
<button class="inline-flex items-center justify-center gap-2 px-8 h-[52px] rounded-full bg-surface-container-highest text-primary font-subhead-lg text-subhead-lg shadow-[0_4px_16px_rgba(89,73,192,0.10)] active:scale-95 transition-all duration-150 cursor-pointer" id="refresh-btn" type="button">
<span class="material-symbols-outlined text-[20px] transition-transform duration-500" id="refresh-icon">
            refresh
          </span>
<span>Refresh</span>
</button>
<!-- Playful Mini Campus Hint -->
<div class="mt-4 flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-on-surface-variant">
<span class="material-symbols-outlined text-[15px] text-primary">notifications_active</span>
<span class="font-label-sm text-label-sm">We'll ping you when new classmates arrive</span>
</div>
</div>
</div>
</div>
<script>
    (function() {
      const btn = document.getElementById('refresh-btn');
      const icon = document.getElementById('refresh-icon');
      if (!btn || !icon) return;

      let angle = 0;
      btn.addEventListener('click', () => {
        angle += 360;
        icon.style.transform = `rotate(${angle}deg)`;
        
        // Tactile bounce feedback
        btn.classList.add('scale-95');
        setTimeout(() => {
          btn.classList.remove('scale-95');
        }, 150);
      });
    })();
  </script>
