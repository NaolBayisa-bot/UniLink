<script>
  // Dynamic subtle drifting confetti bursts
  (function() {
    const container = document.getElementById('confetti-container');
    if (!container) return;

    const shapes = ['✨', '💖', '🤍', '🌸', '✨', '🍃'];
    const colors = ['#E5DEFF', '#FFAEDA', '#9DF4CF', '#FFFFFF', '#FFD8EA'];

    for (let i = 0; i < 12; i++) {
      const el = document.createElement('div');
      const isEmoji = Math.random() > 0.45;
      
      el.style.position = 'absolute';
      el.style.left = (Math.random() * 90 + 5) + '%';
      el.style.top = (Math.random() * 85 + 5) + '%';
      el.style.opacity = (Math.random() * 0.5 + 0.35).toFixed(2);
      el.style.transform = `scale(${(Math.random() * 0.5 + 0.7).toFixed(2)}) rotate(${Math.floor(Math.random() * 360)}deg)`;
      el.style.pointerEvents = 'none';

      if (isEmoji) {
        el.textContent = shapes[Math.floor(Math.random() * shapes.length)];
        el.style.fontSize = (Math.random() * 6 + 14) + 'px';
      } else {
        const size = Math.floor(Math.random() * 6 + 4);
        el.style.width = size + 'px';
        el.style.height = size + 'px';
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
        el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
      }

      container.appendChild(el);
    }
  })();
